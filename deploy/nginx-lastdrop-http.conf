# lastdrop.carrata.fi, vaihe 1 (ennen varmennetta): vain Let's Encryptin tarkistukset.
# Kopio: ~/servers/leafy/web/conf.d/lastdrop.conf. deploy/lastdrop-tls.sh vaihtaa tilalle HTTPS-version.
server {
    listen 80;
    server_name lastdrop.carrata.fi;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
