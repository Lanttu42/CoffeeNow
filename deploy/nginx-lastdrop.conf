# lastdrop.carrata.fi -> coffeenow-kontti (COFFEE!!), HTTPS. Kopio: ~/servers/leafy/web/conf.d/lastdrop.conf
# Upstream ratkaistaan ajon aikana (resolver), jotta Leafyn nginx käynnistyy, vaikka coffeenow olisi alhaalla.
server {
    listen 80;
    server_name lastdrop.carrata.fi;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name lastdrop.carrata.fi;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/lastdrop.carrata.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastdrop.carrata.fi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        set $coffeenow http://coffeenow:8000;
        proxy_pass $coffeenow;
        proxy_set_header Host $host;
        # Korvataan (ei lisätä), jotta asiakas ei voi väärentää IP:tään rate limitiä varten
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
